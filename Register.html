<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Nina Rasa</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/auth.js"></script>
</head>
<body class="register-page">
  <main class="auth-card register-card">
    <section class="brand-panel" aria-label="Nina Rasa">
      <img class="brand-logo-image" src="assets/logo-nina-rasa.png" alt="Logo Nina Rasa - Bakso &amp; Mie Ayam">
    </section>

    <section class="form-panel">
      <h1>REGISTER</h1>
      <form id="register-form">
        <div class="fields">
          <div class="field">
            <label for="username">Username</label>
            <div class="field-control">
              <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" required>
              <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="3.5"></circle>
                <path d="M5.5 20c.4-3.6 2.8-5.5 6.5-5.5s6.1 1.9 6.5 5.5"></path>
              </svg>
            </div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="field-control">
              <input id="password" name="password" type="password" placeholder="Password" autocomplete="new-password" required>
              <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                <rect x="5.5" y="10" width="13" height="10" rx="2"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"></path>
              </svg>
            </div>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm Password</label>
            <div class="field-control">
              <input id="confirm-password" name="confirm-password" type="password" placeholder="Confirm Password" autocomplete="new-password" required>
              <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                <rect x="5.5" y="10" width="13" height="10" rx="2"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"></path>
              </svg>
            </div>
          </div>
        </div>
        <p class="auth-feedback" id="register-feedback" role="status" aria-live="polite"></p>
        <button class="submit-button" type="submit">DAFTAR</button>
      </form>
    </section>
  </main>
  <script>
    const registerForm = document.querySelector("#register-form");
    const registerFeedback = document.querySelector("#register-feedback");
    const registerPassword = document.querySelector("#password");
    const confirmPassword = document.querySelector("#confirm-password");

    if (NinaRasaAuth.getCurrentUsername()) {
      NinaRasaAuth.redirectToNextStep();
    }

    registerForm.addEventListener("submit", event => {
      event.preventDefault();
      if (registerPassword.value !== confirmPassword.value) {
        registerFeedback.textContent = "Konfirmasi password belum sama.";
        confirmPassword.focus();
        return;
      }

      try {
        NinaRasaAuth.register(
          registerForm.elements.username.value,
          registerPassword.value
        );
        NinaRasaAuth.redirectToNextStep();
      } catch (error) {
        registerFeedback.textContent = error.message || "Pendaftaran gagal. Silakan coba lagi.";
      }
    });
  </script>
</body>
</html>
