<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Nina Rasa</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/auth.js"></script>
</head>
<body class="board auth-body">
  <main class="passcard">
    <div class="passcard-brand">
      <img src="assets/logo-nina-rasa.png" alt="">
      <span><strong>NINA RASA</strong><small>Bakso &amp; Mie Ayam</small></span>
    </div>

    <section class="passcard-form">
      <h1>DAF<i>TAR</i></h1>
      <p class="passcard-sub">Bikin kartu pelanggan dulu, tunggu menu panggil.</p>
      <form id="register-form" novalidate>
        <label class="field" for="username">
          <span>Nama pengguna</span>
          <input id="username" name="username" type="text" placeholder="mis. budi08" autocomplete="username" required>
        </label>
        <label class="field" for="password">
          <span>Password</span>
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="new-password" required>
        </label>
        <label class="field" for="confirm-password">
          <span>Konfirmasi password</span>
          <input id="confirm-password" name="confirm-password" type="password" placeholder="ulangi password" autocomplete="new-password" required>
        </label>
        <p class="auth-feedback" id="register-feedback" role="status" aria-live="polite"></p>
        <button class="block-button submit-button" type="submit">Daftar ke kedai →</button>
        <p class="form-link">Sudah punya akun? <a href="Login.html">Masuk di sini!</a></p>
      </form>
    </section>
  </main>

  <script>
    const registerForm = document.querySelector("#register-form");
    const registerFeedback = document.querySelector("#register-feedback");
    const registerPassword = document.querySelector("#password");
    const confirmPassword = document.querySelector("#confirm-password");

    if (NinaRasaAuth.getCurrentUsername()) {
      NinaRasaAuth.redirectToNextStep();
    }

    registerForm.addEventListener("submit", event => {
      event.preventDefault();
      if (registerPassword.value !== confirmPassword.value) {
        registerFeedback.textContent = "Konfirmasi password belum sama.";
        confirmPassword.focus();
        return;
      }

      try {
        NinaRasaAuth.register(
          registerForm.elements.username.value,
          registerPassword.value
        );
        NinaRasaAuth.redirectToNextStep();
      } catch (error) {
        registerFeedback.textContent = error.message || "Pendaftaran gagal. Silakan coba lagi.";
      }
    });
  </script>
</body>
</html>
