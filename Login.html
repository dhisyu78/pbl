<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Nina Rasa</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/auth.js"></script>
</head>
<body class="board auth-body">
  <main class="passcard">
    <div class="passcard-brand">
      <img src="assets/logo-nina-rasa.png" alt="">
      <span><strong>NINA RASA</strong><small>Bakso &amp; Mie Ayam</small></span>
    </div>

    <section class="passcard-form">
      <h1>MASU<i>K</i></h1>
      <p class="passcard-sub">Pintu masuk staf dan pelanggan tetap kedai.</p>
      <form id="login-form" novalidate>
        <label class="field" for="login-username">
          <span>Nama pengguna</span>
          <input id="login-username" name="username" type="text" placeholder="mis. nina01" autocomplete="username" required>
        </label>
        <label class="field" for="login-password">
          <span>Password</span>
          <input id="login-password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </label>
        <p class="form-link">Belum ada akun? <a href="Register.html">Daftar dulu!</a></p>
        <p class="auth-feedback" id="login-feedback" role="status" aria-live="polite"></p>
        <button class="block-button submit-button" type="submit">Masuk kedai →</button>
      </form>
    </section>
  </main>

  <script>
    const loginForm = document.querySelector("#login-form");
    const loginFeedback = document.querySelector("#login-feedback");

    if (NinaRasaAuth.getCurrentUsername()) {
      NinaRasaAuth.redirectToNextStep();
    }

    loginForm.addEventListener("submit", event => {
      event.preventDefault();
      try {
        NinaRasaAuth.login(
          loginForm.elements.username.value,
          loginForm.elements.password.value
        );
        NinaRasaAuth.redirectToNextStep();
      } catch (error) {
        loginFeedback.textContent = error.message || "Login gagal. Silakan coba lagi.";
      }
    });
  </script>
</body>
</html>
