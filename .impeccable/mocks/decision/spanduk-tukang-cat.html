<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spanduk Tukang Cat — Menu Nina Rasa</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 390px; height: 844px; overflow: hidden;
    background: #5e150b; color: #fdf3dd;
    font-family: "Baloo 2", Arial, sans-serif;
    position: relative;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
  .badge { background: #fdf3dd; color: #5e150b; font-weight: 800; font-size: 13px; padding: 6px 12px; border-radius: 999px; }
  .jam { font-size: 12px; font-weight: 700; color: #f7b32b; }
  .quote { text-align: center; margin: 8px 0 4px; }
  .quote h1 {
    font-family: "Titan One", "Baloo 2", cursive;
    font-size: 44px; line-height: .98; letter-spacing: .01em;
    color: #f7b32b; text-shadow: 3px 4px 0 #2c0904; transform: rotate(-2deg);
  }
  .quote p { font-size: 13px; font-weight: 700; color: #cfe6c2; margin-top: 6px; transform: rotate(-1deg); }
  .list { padding: 6px 18px 0; }
  .row {
    display: flex; align-items: center; gap: 12px;
    border-bottom: 2px dashed #b06a3f; padding: 11px 0;
  }
  .row:first-child { padding-top: 0; }
  .em { font-size: 30px; filter: drop-shadow(0 3px 0 #2c0904); }
  .tt { flex: 1; min-width: 0; }
  .tt b {
    display: block; font-family: "Titan One", "Baloo 2", cursive;
    font-size: 20px; line-height: 1.1; color: #fdf3dd; letter-spacing: .01em;
    text-shadow: 2px 3px 0 #2c0904;
  }
  .tt small { font-size: 11px; color: #d9a58a; font-weight: 600; }
  .pr { text-align: right; }
  .pr b {
    display: inline-block; background: #f7b32b; color: #4a1408;
    font-weight: 800; font-style: italic; font-size: 16px;
    padding: 3px 10px; border-radius: 999px; transform: rotate(2deg);
    box-shadow: 0 3px 0 #2c0904;
  }
  .pr small { display: block; margin-top: 4px; font-size: 10px; font-weight: 700; color: #f7b32b; letter-spacing: .08em; }
  .habis b { background: #4a1408; color: #d9a58a; box-shadow: none; }
  .baris { transform: rotate(0deg); }
  .baris:nth-child(2) { transform: rotate(-.4deg); }
  .baris:nth-child(4) { transform: rotate(.4deg); }
  .cart {
    position: absolute; left: 12px; right: 12px; bottom: 14px;
    background: #fdf3dd; color: #5e150b;
    border: 3px solid #2c0904; border-radius: 16px;
    box-shadow: 0 6px 0 #2c0904;
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 16px; transform: rotate(-1deg);
  }
  .cart small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #a3692f; }
  .cart strong { font-size: 16px; }
  .cta { background: #2f855a; color: #fff; font-weight: 800; font-size: 14px; padding: 10px 16px; border-radius: 999px; box-shadow: 0 3px 0 #1e4f34; }
</style>
</head>
<body>
  <link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <div class="topbar">
    <span class="badge">🐓 NINA RASA</span>
    <span class="jam">BUKA · 10.00–20.00</span>
  </div>
  <div class="quote">
    <h1>Mau Makan<br>Apa Hari Ini?</h1>
    <p>"Rasa Pas, Bikin Nagih!"</p>
  </div>
  <div class="list">
    <div class="row baris">
      <span class="em">🍲</span>
      <div class="tt"><b>Bakso Solo Campur</b><small>Kuah kaldu gurih</small></div>
      <div class="pr"><b>Rp 20.000</b><small>2 PORSI ✓</small></div>
    </div>
    <div class="row baris">
      <span class="em">🍜</span>
      <div class="tt"><b>Mie Ayam Mozarella</b><small>Mozarella meleleh</small></div>
      <div class="pr"><b>Rp 15.000</b></div>
    </div>
    <div class="row baris">
      <span class="em">🧋</span>
      <div class="tt"><b>Es Teh</b><small>Gula asli batu</small></div>
      <div class="pr"><b>Rp 4.000</b></div>
    </div>
    <div class="row baris">
      <span class="em">🥤</span>
      <div class="tt"><b>Es Cincau</b><small>Maaf, habis hari ini</small></div>
      <div class="pr habis"><b>HABIS</b></div>
    </div>
  </div>
  <div class="cart">
    <span><small>Pesananmu</small><strong>3 item · Rp 39.000</strong></span>
    <span class="cta">Lihat Pesanan →</span>
  </div>
</body>
</html>
